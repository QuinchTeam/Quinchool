services:
  crawl4ai:
    image: unclecode/crawl4ai:0.8.0
    container_name: quinchool-crawl4ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: "1gb"

  postgres:
    # pgvector's image is postgres:17 plus the vector extension, so the existing
    # data volume attaches unchanged. Must be the -trixie (Debian 13) variant:
    # the default tag is Debian 12, whose older glibc reports a different
    # collation version and invalidates every text index in the volume.
    image: pgvector/pgvector:pg17-trixie
    container_name: quinchool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quinchool
      POSTGRES_PASSWORD: quinchool
      POSTGRES_DB: quinchool
    # Host 5432 is taken by other local Postgres containers, so map to 5433.
    ports:
      - "5433:5432"
    volumes:
      - quinchool-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quinchool -d quinchool"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quinchool-postgres-data:
