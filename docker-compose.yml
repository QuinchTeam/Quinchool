services:
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/otel-collector/config.local.yaml:/etc/otelcol/config.yaml:ro

  crawl4ai:
    image: unclecode/crawl4ai:0.8.0
    container_name: quinchool-crawl4ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: "1gb"

  postgres:
    # pgvector's image is postgres:17 plus the vector extension, so the existing
    # data volume attaches unchanged. Must be the -trixie (Debian 13) variant:
    # the default tag is Debian 12, whose older glibc reports a different
    # collation version and invalidates every text index in the volume.
    image: pgvector/pgvector:pg17-trixie
    container_name: quinchool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quinchool
      POSTGRES_PASSWORD: quinchool
      POSTGRES_DB: quinchool
    # Host 5432 is taken by other local Postgres containers, so map to 5433.
    ports:
      - "5433:5432"
    volumes:
      - quinchool-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quinchool -d quinchool"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3 for uploads (production uses Cloudflare R2). scripts/garage-init.mjs,
  # run by `pnpm infra`, creates the layout, bucket and the fixed local key.
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: quinchool-garage
    restart: unless-stopped
    environment:
      # Local-only cluster secret; nothing outside this machine talks to it.
      GARAGE_RPC_SECRET: 6c6f63616c2d6f6e6c792d6761726167652d7270632d7365637265742d303031
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - quinchool-garage-data:/var/lib/garage

volumes:
  quinchool-postgres-data:
  quinchool-garage-data:
