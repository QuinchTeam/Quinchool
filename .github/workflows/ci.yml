name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  tailwind-tokens:
    name: No Tailwind arbitrary values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Test Tailwind arbitrary-value guard
        run: npm run test:tailwind
      - name: Check for Tailwind arbitrary values
        run: npm run lint:tailwind
