name: "🧪 CI"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tailwind-tokens:
    name: "🎨 Reject arbitrary Tailwind values"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must precede setup-node: the pnpm store cache needs pnpm on PATH. The
      # version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for Tailwind arbitrary values
        run: pnpm lint:tailwind

  observability:
    name: Observability migration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      BETTER_AUTH_SECRET: observability-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @quinchool/api test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/ai/requirements.txt
      - run: python -m pip install -r apps/ai/requirements.txt pytest
      - run: python -m pytest tests -q
        working-directory: apps/ai
      - run: pnpm --filter @quinchool/web exec next typegen
      - run: pnpm --filter @quinchool/web check
      - run: pnpm --filter @quinchool/web test
      - name: Validate production collector
        run: |
          docker build --file infra/otel-collector/Dockerfile --tag quinchool-otel-validation .
          docker run --rm -e GOOGLE_CLOUD_PROJECT=validation-project quinchool-otel-validation validate --config=/etc/otelcol-google/config.yaml
