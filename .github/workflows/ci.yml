name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tailwind-tokens:
    name: No Tailwind arbitrary values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must precede setup-node: the pnpm store cache needs pnpm on PATH. The
      # version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Tailwind arbitrary-value guard
        run: pnpm test:tailwind
      - name: Check for Tailwind arbitrary values
        run: pnpm lint:tailwind
