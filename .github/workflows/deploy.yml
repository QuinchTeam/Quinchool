name: "🚀 Deploy"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required by google-github-actions/auth for Workload Identity Federation.
  id-token: write

jobs:
  deploy:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Private: only the API calls it, with an ID token. Generation is
          # slow, so the request timeout matches the API's own client timeout.
          - service: ai
            label: "🤖 AI"
            serviceFlags: --no-allow-unauthenticated --timeout=300
            flags: >-
              --memory=2Gi
              --set-env-vars=CRAWL4AI_URL=${{ vars.CRAWL4AI_URL }},GEMINI_MODEL=${{ vars.GEMINI_MODEL }},LANGFUSE_HOST=${{ vars.LANGFUSE_HOST }},OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318,GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},OTEL_SERVICE_NAME=quinchool-ai
              --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,CLOUDFLARE_ACCOUNT_ID=cloudflare-account-id:latest,CLOUDFLARE_API_TOKEN=cloudflare-api-token:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,GROQ_API_KEY=groq-api-key:latest,LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest,LANGFUSE_SECRET_KEY=langfuse-secret-key:latest
          # Public: the browser calls it directly with the session cookie.
          - service: api
            label: "⚙️ API"
            serviceFlags: --allow-unauthenticated --timeout=300
            flags: >-
              --set-env-vars=AI_SERVICE_URL=${{ vars.AI_SERVICE_URL }},BETTER_AUTH_URL=${{ vars.API_URL }},WEB_ORIGIN=${{ vars.WEB_URL }},COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN }},OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318,GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},OTEL_SERVICE_NAME=quinchool-api
              --set-secrets=DATABASE_URL=database-url:latest,BETTER_AUTH_SECRET=better-auth-secret:latest
          - service: web
            label: "🌐 Web"
            serviceFlags: --allow-unauthenticated
            buildArgs: >-
              --build-arg NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
              --build-arg NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
              --build-arg SENTRY_ORG=${{ vars.SENTRY_ORG }}
              --build-arg SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
              --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN
            flags: >-
              --set-env-vars=SENTRY_DSN=${{ vars.SENTRY_DSN }},OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318,GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},OTEL_SERVICE_NAME=quinchool-web
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/quinchool/${{ matrix.service }}:${{ github.sha }}
          DOCKER_BUILDKIT: "1"
        run: |
          if [ "${{ matrix.service }}" = "web" ]; then
            # Used only by the web build's BuildKit secret mount; never written
            # to the image or command output.
            export SENTRY_AUTH_TOKEN="$(gcloud secrets versions access latest --secret=sentry-auth-token)"
          fi
          docker build \
            --file apps/${{ matrix.service }}/Dockerfile \
            ${{ matrix.buildArgs }} \
            --tag "$IMAGE" \
            .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          COLLECTOR_IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/quinchool/otel-collector:${{ github.sha }}-${{ matrix.service }}"
          docker build --file infra/otel-collector/Dockerfile --tag "$COLLECTOR_IMAGE" .
          docker push "$COLLECTOR_IMAGE"
          APP_CONTAINER="$(gcloud run services describe quinchool-${{ matrix.service }} \
            --region ${{ vars.GCP_REGION }} --format=json 2>/dev/null \
            | jq -r '.spec.template.spec.containers[] | select(.ports != null) | .name' || true)"
          APP_CONTAINER="${APP_CONTAINER:-app}"
          gcloud run deploy quinchool-${{ matrix.service }} \
            --no-cpu-throttling \
            --region ${{ vars.GCP_REGION }} \
            --service-account ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }} \
            --quiet \
            ${{ matrix.serviceFlags }} \
            --container "$APP_CONTAINER" \
            --depends-on otel-collector \
            --image ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/quinchool/${{ matrix.service }}:${{ github.sha }} \
            --port 8080 \
            ${{ matrix.flags }} \
            --container otel-collector \
            --image "$COLLECTOR_IMAGE" \
            --memory 128Mi \
            --cpu 1 \
            --set-env-vars GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }} \
            --startup-probe httpGet.path=/,httpGet.port=13133,timeoutSeconds=5,periodSeconds=5,failureThreshold=12 \
            --liveness-probe httpGet.path=/,httpGet.port=13133,timeoutSeconds=5,periodSeconds=30,failureThreshold=3
